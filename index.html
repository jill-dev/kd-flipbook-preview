<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KD Auctions — Flipbook Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1a1a1a; font-family: 'Montserrat', Arial, sans-serif; color: #e8e8e6;
  }
  .wrap { max-width: 560px; padding: 40px; text-align: center; }
  h1 { color: #ddb305; font-size: 22px; letter-spacing: 1px; margin: 0 0 8px; }
  p.sub { color: #b3b3b3; font-size: 14px; margin: 0 0 32px; }
  .card {
    display: block; text-decoration: none; background: #2d2d2b; border: 1px solid #3a3a38;
    border-radius: 10px; padding: 20px 24px; margin: 0 0 16px; text-align: left; transition: border-color 0.15s;
  }
  .card:hover { border-color: #ddb305; }
  .card .name { color: #fff; font-weight: 700; font-size: 16px; margin: 0 0 4px; }
  .card .desc { color: #b3b3b3; font-size: 13px; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>KD AUCTIONS — FLIPBOOK PREVIEW</h1>
    <p class="sub">Pick a catalog to view</p>
    <a class="card" href="viewer/index.html?auction=portland">
      <p class="name">Portland, OR — Form Factory Inc.</p>
      <p class="desc">Complete Closure of a CNC Prototype &amp; Production Machining Company (real auction, 75 lots)</p>
    </a>
    <a class="card" href="viewer/index.html?auction=south-bend">
      <p class="name">South Bend, IN / Winter Springs, FL</p>
      <p class="desc">Sample catalog used to design the template</p>
    </a>
  </div>
</body>
</html>
