<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../../brand/brand.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .sheet {
    width: 1000px; height: 1294px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(120% 90% at 50% 100%, #262624 0%, var(--kd-bg) 55%);
  }
  img.logo { height: 90px; width: auto; margin-bottom: 26px; filter: brightness(0) invert(1); }
  h2 { font-size: 30px; margin: 0 0 14px; }
  p.tag { font-family: var(--kd-font-primary); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--kd-grey); font-size: 13px; margin: 0 0 40px; }
  .cta { margin-bottom: 46px; }
  .contact { font-family: var(--kd-font-secondary); color: var(--kd-grey-2); font-size: 13px; line-height: 1.8; }
  .contact b { color: #fff; }
  .site { margin-top: 30px; font-family: var(--kd-font-primary); font-weight: 900; font-size: 24px; letter-spacing: 2px; color: var(--kd-yellow); }
</style>
</head>
<body>
  <div class="sheet kd-page">
    <img class="logo" src="{{logo.dark}}" alt="KD Auctions" />
    <h2 class="kd-heading">See the Full Catalog Online</h2>
    <p class="tag">Bid from anywhere &mdash; every lot, every photo, every detail</p>
    <div class="cta">
      <a class="kd-btn" href="{{bidUrl}}" target="_blank" rel="noopener" data-kd-track="bid_now">Bid Now &#8594;</a>
    </div>
    <div class="contact">
      <b>{{contact.name}}</b><br />
      {{contact.email}} &middot; {{contact.phone}}
    </div>
    <div class="site">KDAUCTIONS.COM</div>
  </div>
  <script src="../../../brand/track.js"></script>
</body>
</html>
