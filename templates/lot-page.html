<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../../brand/brand.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .sheet { width: 1000px; height: 1294px; position: relative; overflow: hidden; }
  .inner { padding: 30px 44px 90px; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .head img { height: 30px; width: auto; opacity: 0.9; }
  .head .meta { text-align: right; font-family: var(--kd-font-primary); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--kd-grey); }
  .head .meta b { color: var(--kd-yellow); }
  .titlebar { margin: 18px 0 22px; }
  .titlebar h2 { margin: 0; font-size: 22px; }
  .location {
    font-family: var(--kd-font-primary); font-weight: 800; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--kd-black); background: var(--kd-yellow); display: inline-block; padding: 8px 16px; border-radius: 6px;
  }
  tr.location-row td { padding: 18px 0 6px; border-bottom: none; }
  tr.location-row:first-child td { padding-top: 0; }
  table.lots { width: 100%; border-collapse: collapse; }
  table.lots tr { border-bottom: 1px solid var(--kd-line); }
  table.lots td { vertical-align: top; padding: 16px 0; }
  .lotnum {
    width: 64px; font-family: var(--kd-font-primary); font-weight: 800; font-size: 15px; color: var(--kd-yellow); padding-right: 14px !important;
  }
  .photo { width: 150px; padding-right: 20px !important; }
  .photo img { width: 150px; height: 112px; object-fit: cover; border-radius: 6px; border: 1px solid var(--kd-line); display: block; }
  .desc { font-family: var(--kd-font-secondary); font-size: 14.5px; line-height: 1.5; color: #e4e4e2; padding-right: 8px !important; }
  .bid { width: 92px; text-align: right; white-space: nowrap; }
  .bid a { font-family: var(--kd-font-primary); font-weight: 700; font-size: 12.5px; letter-spacing: 0.5px; color: var(--kd-yellow); text-decoration: none; }
  .bid a:hover { text-decoration: underline; }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 44px 22px; display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--kd-line); background: var(--kd-bg);
  }
  .footer .site { font-family: var(--kd-font-primary); font-weight: 800; font-size: 14px; letter-spacing: 1.5px; color: var(--kd-yellow); }
  .footer .page { font-family: var(--kd-font-primary); font-weight: 600; font-size: 12px; color: var(--kd-grey); }
</style>
</head>
<body>
  <div class="sheet kd-page">
    <div class="kd-gradient-bar"></div>
    <div class="inner">
      <div class="head">
        <a href="https://www.kdauctions.com" target="_blank" rel="noopener"><img src="{{logo.light}}" alt="KD Auctions" /></a>
        <div class="meta"><b>{{closing.label}}:</b> {{closing.day}} · {{closing.time}}</div>
      </div>
      <div class="titlebar">
        <h2 class="kd-eyebrow">{{title}}</h2>
      </div>
      <table class="lots">
        {{#each lots}}
        {{#if locationChanged}}
        <tr class="location-row"><td colspan="4"><div class="location">{{location}}</div></td></tr>
        {{/if}}
        <tr id="lot-{{lot}}" data-kd-track="lot_view" data-lot="{{lot}}">
          <td class="lotnum">#{{lot}}</td>
          {{#if photo}}<td class="photo"><img src="{{photo}}" alt="Lot {{lot}}" /></td>{{else}}<td class="photo"></td>{{/if}}
          <td class="desc">{{description}}</td>
          <td class="bid"><a href="{{#if bidUrl}}{{bidUrl}}{{else}}{{../bidUrl}}{{/if}}" target="_blank" rel="noopener" data-kd-track="lot_click" data-lot="{{lot}}">Bid Now &#8594;</a></td>
        </tr>
        {{/each}}
      </table>
    </div>
    <div class="footer">
      <a class="site" href="https://www.kdauctions.com" target="_blank" rel="noopener" style="text-decoration:none;">KDAUCTIONS.COM</a>
      <span class="page">Page {{pageNumber}} of {{pageCount}}</span>
    </div>
  </div>
  <script src="../../../brand/track.js"></script>
</body>
</html>
