<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />

<link rel="stylesheet" href="../../../brand/brand.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .sheet {
    width: 1400px; height: 900px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(120% 90% at 50% 100%, #262624 0%, var(--kd-bg) 55%);
  }
  img.logo { height: 110px; width: auto; margin-bottom: 26px; }
  h2 { font-size: 42px; margin: 0 0 14px; }
  p.tag { font-family: var(--kd-font-primary); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--kd-grey); font-size: 19px; margin: 0 0 40px; }
  .cta { margin-bottom: 46px; }
  .contact { font-family: var(--kd-font-secondary); color: var(--kd-grey-2); font-size: 22px; line-height: 1.7; }
  .contact b { color: #fff; }
  .site { margin-top: 30px; font-family: var(--kd-font-primary); font-weight: 900; font-size: 30px; letter-spacing: 2px; color: var(--kd-yellow); }
  .kd-btn.big { font-size: 20px; padding: 16px 36px; border-radius: 10px; }
</style>
</head>
<body>
  <div class="sheet kd-page">
    <a href="https://www.kdauctions.com" target="_blank" rel="noopener"><img class="logo" src="../../../brand/logo-light.png" alt="KD Auctions" /></a>
    <h2 class="kd-heading">See the Full Catalog Online</h2>
    <p class="tag">Bid from anywhere &mdash; every lot, every photo, every detail</p>
    <div class="cta">
      <a class="kd-btn big" href="https://www.kdauctions.com" target="_blank" rel="noopener" data-kd-track="bid_now">Bid Now &#8594;</a>
    </div>
    <div class="contact">
      <b>KD Auctions</b><br />
      <a href="mailto:service@kdauctions.com" style="color:inherit;">service@kdauctions.com</a> &middot; <a href="tel:4804553910" style="color:inherit;">480.455.3910</a>
    </div>
    <div class="site"><a href="https://www.kdauctions.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">KDAUCTIONS.COM</a></div>
  </div>
  <script src="../../../brand/track.js"></script>
</body>
</html>
